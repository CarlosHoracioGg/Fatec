<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulários</title>
</head>
<body>
    <form action="https://www.cachorros.com">
        <div>
            <label >Placa:</label>
            <input type="text" name="Placa" 
                maxlength="8" 
                required
                placeholder="LLNNLNLN"
                title="Placa do Veículo"
                pattern="[A-Z]{2}[0-9]{2}[A-Z][0-9][A-Z][0-9]"
            >
        </div>
        <!--Tipo 1: -->
        <!-- pattern="[A-Z][A-Z][0-9][0-9][A-Z][0-9][A-Z][0-9]"-->
        <!--Tipo 2: -->
        <!--pattern="[A-Z]{2}[0-9]{2}[A-Z][0-9][A-Z][0-9]"-->
        <div>
            <label >Marca:</label>
           <select name="Marca" id="1">
            <option value="1">BMW</option>
            <option value="2" selected>Mercedes Benz</option>
            <option value="3">Jac</option>
           </select>
        </div>
         <div>
            <label >Preço</label>
              <input type="number" name="Preço" required
              min="1000" max="1000000" step="0.01">
        </div>
         <div>
            <label >Origem</label>
              <input type="radio" name="origem" id="1"checked>
              <input type="radio" name="origem" id="2">
        </div>
        <div>
            <label>0KM</label>
            <input type="checkbox" name="zerokm" checked>
        </div>
        <div>
            <label>Histórico</label>
            <textarea name="histórico" rows="5" cols="40"></textarea>
        </div>
        <div>
              <input type="submit" value="Enviar">
        </div>
         
        
    </form>
</body>
</html>
